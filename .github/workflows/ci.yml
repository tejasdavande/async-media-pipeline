name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: s3
          S3_SKIP_SIGNATURE_VALIDATION: 0
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/media_pipeline
      S3_BUCKET: media
      S3_REGION: us-east-1
      S3_ENDPOINT: http://localhost:4566
      S3_FORCE_PATH_STYLE: true
      # localstack checks presigned signatures against the secret "test"
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: aws --endpoint-url http://localhost:4566 s3 mb s3://media
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
      - run: npm run test:e2e
